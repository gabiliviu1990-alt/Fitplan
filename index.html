return'<div class="card"><h2>Profil</h2><div class="g2"><label>Sex<select id="ps">'+o("m","Bărbat",p.sex)+o("f","Femeie",p.sex)+'</select></label><label>Vârstă<input id="pa" type="number" value="'+p.age+'"></label><label>Înălțime (cm)<input id="pH" type="number" value="'+p.h+'"></label><label>Greutate (kg)<input id="pw" type="number" step="0.1" value="'+p.w+'"></label></div><label style="margin-top:10px">Grăsime corporală % (opțional, face calculul mai exact)<input id="pf" type="number" step="0.1" placeholder="ex: 20" value="'+(p.bf||"")+'"></label><label style="margin-top:10px">Cât de activ ești<select id="pc">'+o(1.2,"Sedentar (birou, puțină mișcare)",p.act)+o(1.375,"Ușor activ (antrenament 1-3 zile/săpt)",p.act)+o(1.55,"Moderat activ (3-5 zile/săpt)",p.act)+o(1.725,"Foarte activ (6-7 zile/săpt)",p.act)+o(1.9,"Extrem (muncă fizică + antrenament zilnic)",p.act)+'</select></label><p class="mut" style="margin:6px 0 0;font-size:12px">Dacă ești între două variante, alege-o pe cea mai mică.</p><button class="p" style="margin-top:12px;width:100%" onclick="sp()">Salvează și calculează</button></div>'+planCard()}
function prof(){return prof0()+calibCard()+wtCard()+dataCard()+(PHOTO?keyCard():"")+aboutCard()}
function addW(){var v=+$("#wi").value;if(!v)return;var a=S.wt.filter(function(x){return x.d===day})[0];if(a)a.w=v;else S.wt.push({d:day,w:v});S.p.w=v;save();go()}
function delW(i){S.wt.splice(i,1);save();go()}
function wtCard(){var a=S.wt,L=a.slice(-30),h='<div class="card"><h2>Greutate corporală</h2><div class="row"><input id="wi" type="number" step="0.1" placeholder="kg" style="width:100px"><button class="p" onclick="addW()">Adaugă azi</button></div>';
if(L.length<2)h+='<p class="mut">Adaugă cel puțin 2 măsurători ca să apară graficul.</p>';else{var ws=L.map(function(x){return x.w}),mn=Math.min.apply(0,ws),mx=Math.max.apply(0,ws),rg=(mx-mn)||1,n=L.length,pt=L.map(function(x,i){return[30+i*(280/(n-1)),15+(mx-x.w)/rg*100]}),d=a[a.length-1].w-a[0].w;
h+='<svg viewBox="0 0 320 150" style="width:100%;margin-top:8px"><line x1="30" y1="15" x2="310" y2="15" stroke="var(--bd)"/><line x1="30" y1="115" x2="310" y2="115" stroke="var(--bd)"/><polyline fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round" points="'+pt.map(function(p){return p[0]+","+p[1]}).join(" ")+'"/>'+pt.map(function(p){return'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="var(--ac)"/>'}).join("")+'<text x="2" y="19" font-size="10" fill="var(--mut)">'+mx+'</text><text x="2" y="119" font-size="10" fill="var(--mut)">'+mn+'</text><text x="30" y="140" font-size="10" fill="var(--mut)">'+L[0].d.slice(5)+'</text><text x="310" y="140" text-anchor="end" font-size="10" fill="var(--mut)">'+L[n-1].d.slice(5)+'</text></svg><p class="mut" style="margin:4px 0 0">De la prima măsurătoare: '+(d>0?"+":"")+d.toFixed(1)+" kg</p>"}
h+=a.slice(-5).reverse().map(function(x){var i=a.indexOf(x);return'<div class="row sp mut"><span>'+x.d+" · "+x.w+' kg</span><button class="x" onclick="delW('+i+')">✕</button></div>'}).join("");return h+"</div>"}
function saveKey(c){var k=c?"":($("#ak").value||"").trim();S.key=k;try{localStorage.setItem("fitplan_key",k)}catch(e){}go()}
function keyCard(){return'<div class="card"><h2>Scanare cu API</h2><p class="mut" style="margin:0 0 8px">Pentru scanare în afara claude.ai (de exemplu pe GitHub Pages). Cheia rămâne doar în acest browser. Pune o limită de cheltuieli pe cheie în console.anthropic.com.</p><input id="ak" type="password" placeholder="sk-ant-..." value="'+esc(S.key)+'" style="width:100%"><div class="row" style="margin-top:8px"><button class="p" onclick="saveKey(0)">Salvează cheia</button><button onclick="saveKey(1)">Șterge</button></div></div>'}

var RO=[[-0.75,"Slăbit rapid","−0,75 kg/săpt"],[-0.5,"Slăbit moderat","−0,5 kg/săpt"],[-0.25,"Slăbit lent","−0,25 kg/săpt"],[0,"Menținere","greutate stabilă"],[0.25,"Masă lentă","+0,25 kg/săpt"],[0.5,"Masă","+0,5 kg/săpt"]];
function rtiles(fn){var p=S.p,r=rateOf(p);return'<div class="g4" style="grid-template-columns:repeat(3,1fr)">'+RO.map(function(o){var on=Math.abs(r-o[0])<.001;return'<div onclick="'+fn+'('+o[0]+')" style="cursor:pointer;outline:2px solid '+(on?"var(--ac)":"transparent")+'"><div class="mut">'+o[1]+'</div><b>'+kcalFor(p,o[0])+'</b><div class="mut">kcal · '+o[2]+'</div></div>'}).join("")+"</div>"}
function setRate(v){S.p.rate=v;S.p.ok=1;save();go()}
function planCard(){var p=S.p,g=goal(),fl=p.sex==="m"?1500:1200;
return'<div class="card"><h2>Câte kcal să consumi</h2><p class="mut" style="margin:0 0 8px">Consumi zilnic circa <b>'+g.td+' kcal</b> (metabolism de bază '+g.b+', formula '+g.m+(p.useCal?", calibrat după datele tale":"")+'). Alege ritmul:</p>'+rtiles("setRate")+'<p style="margin:10px 0 4px">Țintă zilnică: <b>'+g.k+' kcal</b></p><p class="mut" style="margin:0">'+g.p+' g proteine · '+g.c+' g carbo · '+g.f+' g grăsimi</p><p class="mut" style="margin:8px 0 0;font-size:12px">Pentru siguranță, ținta nu coboară sub '+fl+' kcal și nici sub 70% din consumul tău. Estimarea poate diferi de realitate cu până la ~10% sau mai mult, de la om la om. Calibrarea de mai jos o corectează după datele tale.</p></div>'}
function sp(){var q=S.p,bf=+$("#pf").value||0;S.p={sex:$("#ps").value,age:+$("#pa").value||q.age,h:+$("#pH").value||q.h,w:+$("#pw").value||q.w,bf:bf,act:+$("#pc").value,rate:q.rate,goal:q.goal,cal:q.cal,useCal:q.useCal,ok:1};save();go()}
var T=[["azi","🏠","Azi",azi],["ant","🏋️","Antrenament",ant],["fab"],["ret","🍽️","Rețete",ret],["prof","👤","Profil",prof]];
function go(){if(S.tab!=="azi")S.cam=0;if(!S.cam)stopCam();if(!S.p.ok){ob();return}$("#nav").style.display="";var t=T.filter(function(x){return x[0]===S.tab})[0];$("#v").innerHTML=t[3]();if(S.tab!=="azi")$("#hs").textContent={ant:"Programe și exerciții",ret:R.length+" rețete",prof:"Țelul tău"}[S.tab];
$("#nav").innerHTML=T.map(function(x){return x[0]==="fab"?'<button class="fab" aria-label="Scanează mâncarea" onclick="fabClick()">'+(PHOTO?"📷":"📦")+'</button>':'<button class="'+(x[0]===S.tab?"on":"")+'" onclick="S.tab=\''+x[0]+'\';go();scrollTo(0,0)"><b>'+x[1]+"</b>"+x[2]+"</button>"}).join("")}
$("#ph").onchange=function(){if(this.files[0])doScan(this.files[0]);this.value=""};
$("#th").onclick=function(){var d=document.documentElement,c=d.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.setAttribute("data-theme",c==="dark"?"light":"dark")};
go();
try{if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js")}catch(e){}
</script></body></html>
